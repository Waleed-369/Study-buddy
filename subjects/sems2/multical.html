<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notes</title>
    <link rel="stylesheet" href="notes-style.css">
</head>
<style>
*{
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}
body {
    min-height: 100vh;
    background: url(../../pictures/pexels-minan1398-1441597\ \(1\).jpg) ;
    background-size: cover;
    background-position: center;
    display: flex;
    flex-direction: column;
    background-repeat: no-repeat;
    background-attachment: fixed;
}

.header {
    background:rgba(0, 0, 0, .1);
    backdrop-filter: blur(50px);
    color:white;
    padding: 1rem;
    text-align:center;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    z-index: 100;
}

.title {
    font-size: 2rem;
}

.notes-container {
    display: flex;
    flex-direction: row;
    justify-content: space-evenly;
    gap: 1rem;
    padding: 1.5rem;
    width: 100%;
    margin: auto;
    left: 0rem;
    top: 5rem;
    position: absolute;
    flex-wrap: wrap;
    align-content: flex-start;
}

.note-card {
    background: rgba(255, 255, 255, 0.1);
    backdrop-filter: blur(10px);
    padding: 1rem 1.2rem;
    border-radius: 8px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    width: 19rem;
    height: 8rem;
}

.note-card h2 {
    font-size: 3vh;
    margin-bottom: .5rem;
    color: white;
}

.btn {
    display: inline-block;
    padding: .5rem 1rem;
    background: #000000;
    color: white;
    text-decoration: none;
    border-radius: 5px;
    transition: .3s;
}

.btn:hover {
    background: #1d2f43;
}
@media( max-width:480px) {
    .title{
        font-size: 3vh;
    }
}

</style>
<body>

<header class="header">
    <h1 class="title">Multivariable Calculus</h1>
</header>

<section class="notes-container">

    <div class="note-card">
        <h2>Calculus with Analytic Geometry Swokowski</h2>
        <a href="../../Notes/sem1/Calculus/calculus with analytic geometry swokowski ( www.ciit-students.com ).pdf" target="_blank" class="btn">View Notes</a>
    </div>

    <div class="note-card">
        <h2>Lecture #1</h2>
        <a href="../../Notes/sem2/Multical/Lecture01.pdf" target="_blank" class="btn">View Notes</a>
    </div>

      <div class="note-card">
        <h2>Lecture #2</h2>
        <a href="../../Notes/sem2/Multical/Lecture02.pdf" target="_blank" class="btn">View Notes</a>
    </div>

    <div class="note-card">
        <h2>Lecture #3</h2>
        <a href="../../Notes/sem2/Multical/Lecture03.pdf" target="_blank" class="btn">View Notes</a>
    </div>

    <div class="note-card">
        <h2>Lecture #5</h2>
        <a href="../../Notes/sem2/Multical/Lecture05.pdf" target="_blank" class="btn">View Notes</a>
    </div>

      <div class="note-card">
        <h2>Lecture #6</h2>
        <a href="../../Notes/sem2/Multical/Lecture06.pdf" target="_blank" class="btn">View Notes</a>
    </div>

    <div class="note-card">
        <h2>Lecture #7</h2>
        <a href="../../Notes/sem2/Multical/Lecture07.pdf" target="_blank" class="btn">View Notes</a>
    </div>

</section>

</body>
</html>
